<script type="text/plain" id="src-sql2">
create extension if not exists vector;
create table if not exists public.knowledge_chunks (
id uuid primary key default gen_random_uuid(),
workspace_id uuid not null references public.workspaces(id) on delete cascade,
doc_id text not null, content text not null, embedding vector(768),
created_at timestamptz default now());
create index if not exists chunks_ws_idx on public.knowledge_chunks(workspace_id);
create index if not exists chunks_doc_idx on public.knowledge_chunks(doc_id);
create index if not exists chunks_hnsw_idx on public.knowledge_chunks using hnsw (embedding vector_cosine_ops);
alter table public.knowledge_chunks enable row level security;
drop policy if exists chunks_member on public.knowledge_chunks;
create policy chunks_member on public.knowledge_chunks for all
using (workspace_id in (select id from public.workspaces where owner_id = auth.uid()))
with check (workspace_id in (select id from public.workspaces where owner_id = auth.uid()));
create or replace function public.increment_ai_usage(wsid uuid) returns void language sql security definer as $$
update public.workspaces set usage_ai = usage_ai + 1 where id = wsid; $$;
create or replace function public.enforce_agent_limit() returns trigger language plpgsql security definer as $$
declare v_plan text; v_count int; v_limit int;
begin
select plan into v_plan from public.workspaces where id = NEW.workspace_id;
v_limit := case when v_plan='growth' then 10 when v_plan='pro' then 999 else 8 end;
select count(*) into v_count from public.agents where workspace_id = NEW.workspace_id;
if v_count >= v_limit then raise exception 'AGENT_LIMIT_REACHED'; end if;
return NEW;
end; $$;
drop trigger if exists trg_agent_limit on public.agents;
create trigger trg_agent_limit before insert on public.agents for each row execute function public.enforce_agent_limit();
insert into storage.buckets (id,name,public) values ('kb-files','kb-files',false) on conflict (id) do nothing;
drop policy if exists kb_files_member on storage.objects;
create policy kb_files_member on storage.objects for all
using (bucket_id='kb-files' and (auth.uid() in (select owner_id from public.workspaces where id::text=(storage.foldername(name))[1])))
with check (bucket_id='kb-files' and (auth.uid() in (select owner_id from public.workspaces where id::text=(storage.foldername(name))[1])));
</script>

-- (استُبدلت في ترحيل المرحلة 4 بالدالة الصارمة — راجع تبويب «٤. العزل الصارم والتشخيص»)

<script type="text/plain" id="src-sql4">
-- إدارة ســوشـــيــــال — Phase 4: عزل صارم بين الوكلاء + أدوات تشخيص
-- عزل صارم: كل وكيل يرى معرفته فقط. لا تسريب عبر agent_id الفارغ.
-- المعرفة "المشتركة" تُكتب الآن بنسخة لكل وكيل عبر (kb-ingest / kb-process / kb-crawl)،
-- لذلك لا حاجة لفتح agent_id IS NULL للجميع.
create or replace function public.match_kb_chunks_agent(ws uuid, ag text, q vector, match_count int default 4)
returns table (doc_id text, content text, similarity float) language sql stable as $$
select c.doc_id, c.content, 1 - (c.embedding <=> q) as similarity
from public.knowledge_chunks c
where c.workspace_id = ws and c.embedding is not null and c.agent_id = ag
order by c.embedding <=> q limit match_count; $$;
-- عرض تشخيصي (شغّله من SQL Editor بحساب مالك المشروع):
create or replace view public.kb_diagnostics as
select d.id as doc_id,
d.workspace_id,
d.data->>'name' as name,
d.data->>'type' as type,
d.data->>'status' as status,
d.data->>'agentId' as agent_id,
(select count(*) from public.knowledge_chunks c where c.doc_id = d.id) as chunks_total,
(select count(*) from public.knowledge_chunks c where c.doc_id = d.id and c.embedding is not null) as embeddings,
(select count(distinct c.agent_id) from public.knowledge_chunks c where c.doc_id = d.id) as agents_linked
from public.knowledge_docs d;
-- استعلامات تشخيصية سريعة:

-- select count(*) from public.knowledge_chunks;
-- select doc_id, count(*) from public.knowledge_chunks group by doc_id order by 2 desc;
-- select agent_id, count(*) from public.knowledge_chunks group by agent_id;
-- حذف مقاطع مصدر معيّن يدويًا:
-- delete from public.knowledge_chunks where doc_id = 'DOC_ID';
</script>

<script type="text/plain" id="src-ai">
// supabase/functions/ai-respond/index.ts — RAG كامل: تضمين السؤال → بحث متجهي → سياق → Gemini (temperature=0.1)
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
const CORS={"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"authorization, x-client-info, api-key, content-type","Access-Control-Allow-Methods":"POST, OPTIONS"};
const json=(b,s=200)=>new Response(JSON.stringify(b),{status:s,headers:{...CORS,"Content-Type":"application/json"}});
const PLAN_LIMITS:Record<string,number>={free:500,growth:5000,pro:50000};
const NO_INFO="عذراً، هذه المعلومة غير متوفرة لدي حالياً، هل أستطيع تحويلك لأحد موظفي الدعم؟";
const HANDOFF=["موظف","انسان","بشري","شخص حقيقي","مختص","مسؤول"];
const norm=(s:string)=>s.replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
function classify(messages:any[],status:string){
const t=norm(messages.filter(m=>m.from==="visitor").map(m=>String(m.text||"")).join(" "));
let score=0;const tags:string[]=[];
if(/(سعر|بكم|يكلف|تكلف)/.test(t)){score+=10;tags.push("سأل عن السعر");}
if(/(توصيل|شحن|يوصل)/.test(t)){score+=15;tags.push("سأل عن التوصيل");}
if(/(دفع|فيزا|مدي|بطاقه|كاش|تحويل بنكي)/.test(t)){score+=20;tags.push("سأل عن الدفع");}
if(/(اريد اطلب|ابغي اطلب|ابى اطلب|اطلب الان|اشتري|اريد الشراء|احجز)/.test(t)){score+=40;tags.push("نية شراء");}
if(/(موظف|انسان|بشري)/.test(t))tags.push("طلب موظف");
score=Math.min(score,100);
let cls="استفسار عام";
if(status==="handoff")cls="يحتاج متابعة";
else if(score>=60)cls="مشتري"; else if(score>=40)cls="عميل محتمل"; else if(score>=15)cls="مهتم";
return {score,cls,tags};
}
Deno.serve(async(req)=>{
if(req.method==="OPTIONS")return new Response("ok",{headers:CORS});
try{
const {widget_id,token,message,conversation_id}=await req.json().catch(()=>({}));
if(!widget_id||!token)return json({error:"bad_request",message:"طلب غير صالح."},400);
const text=String(message??"").trim();
if(!text)return json({error:"empty"},400);
if(text.length>500)return json({error:"too_long"},400);
const admin=createClient(Deno.env.get("SUPABASE_URL")!,Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
const {data:widgetRow}=await admin.from("widgets").select("*").eq("id",String(widget_id)).maybeSingle();
const wd:any=widgetRow?.data??{};
if(!widgetRow||typeof wd.token!=="string"||wd.token!==String(token))return json({error:"invalid_widget"},403);
if(wd.enabled===false)return json({error:"disabled"},403);
if(!wd.agentId)return json({error:"no_agent"},500);
const wsId=widgetRow.workspace_id,agentId=String(wd.agentId);
const {data:wsRow}=await admin.from("workspaces").select("*").eq("id",wsId).maybeSingle();
if(!wsRow)return json({error:"no_workspace"},404);
if((wsRow.usage_ai||0)>=(PLAN_LIMITS[wsRow.plan||"free"]??500))return json({error:"limit",message:"تم تجاوز الحد الشهري لرسائل الذكاء الاصطناعي. الرجاء ترقية الخطة."},429);
const {data:agentRow}=await admin.from("agents").select("*").eq("id",agentId).maybeSingle();
if(!agentRow)return json({error:"no_agent"},500);
const ad:any=agentRow.data??{};
let conv:any=null;
if(conversation_id){const r=await admin.from("conversations").select("*").eq("id",String(conversation_id)).maybeSingle();conv=r.data||null;}
const cd:any=conv?.data||{status:"active",messages:[],contactId:null};
if(cd.status==="handoff"&&!HANDOFF.some(k=>norm(text).includes(norm(k))))return json({handoff_locked:true,message:"هذه المحادثة بيد فريق الدعم الآن، سيتولى موظف بشري الرد."});
if(HANDOFF.some(k=>norm(text).includes(norm(k)))){
cd.status="handoff";cd.messages=cd.messages||[];cd.messages.push({from:"visitor",text,at:Date.now()});cd.updatedAt=Date.now();
if(conv)await admin.from("conversations").update({data:cd}).eq("id",conv.id);
return json({reply:"أكيد، حولتك للموظف المختص الآن ✋ سيتابع معك خلال دقائق.",handoff:true,conversation_id:conv?.id||null});
}
const apiKey=Deno.env.get("GEMINI_API_KEY");
if(!apiKey)return json({error:"server",message:"عذرًا، حصل خطأ مؤقت. حاول مرة ثانية."},500);
const genAI=new GoogleGenerativeAI(apiKey);
// 1) تضمين السؤال
const qVec=(await genAI.getGenerativeModel({model:"text-embedding-004"}).embedContent(text)).embedding.values as number[];
// 2) بحث متجهي في معرفة هذا الـ Agent فقط (عزل صارم)
const {data:hits}=await admin.rpc("match_kb_chunks_agent",{ws:wsId,ag:agentId,q:qVec,match_count:4});
const context=(hits||[]).filter((h:any)=>h.similarity>=0.55).map((h:any)=>h.content).join("\n---\n");
// 3) سياق المحادثة
const history=(cd.messages||[]).slice(-10).filter((m:any)=>m.from==="visitor"||m.from==="ai")
.map((m:any)=>({role:m.from==="visitor"?"user" as const:"model" as const,parts:[{text:String(m.text)}]}));
// 4) Prompt صارم (Grounded) — يمنع الهلوسة منعًا باتًا
const sys=[ad.instructions||"أنت موظف خدمة عملاء.",
"أنت موظف خدمة عملاء لمنصة إدارة ســوشـــيــــال. وظيفتك الوحيدة هي الإجابة بناءً على السياق المرفق فقط (Context).",
"إذا كان السؤال خارج السياق، أو يطلب أسعاراً أو خدمات أو منتجات أو مواعيد أو سياسات أو أرقاماً غير مذكورة في السياق، قل نصاً حرفياً:",
'"'+NO_INFO+'"',
"يمنع منعاً باتاً اختراع أي معلومات أو الاعتماد على معرفتك العامة أو تقدير أي أرقام أو تفاصيل.",
"كن مختصراً وطبيعياً. احترم لغة المستخدم واللهجة المحددة للـ Agent.",

<script type="text/plain" id="src-ingest">
// supabase/functions/kb-ingest/index.ts
// يحفظ النصوص اليدوية كمعرفة حقيقية: تقسيم + تضمينات + عزل حسب الـ Agent.
// يستقبل: { doc_id, text, agent_id, workspace_id } أو { doc_id, delete: true } للحذف الكامل.
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
const json=(b,s=200)=>new Response(JSON.stringify(b),{status:s,headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}});
function chunkText(text:string,size=800,overlap=100){const clean=text.replace(/\s+/g," ").trim();const out:string[]=[];for(let i=0;i<clean.length;i+=size-overlap){const c=clean.slice(i,i+size).trim();if(c.length>20)out.push(c);}return out;}
Deno.serve(async(req)=>{
if(req.method==="OPTIONS")return new Response("ok",{headers:{"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"*"}});
try{
const body=await req.json().catch(()=>({}));
const doc_id=body.doc_id;
if(!doc_id)return json({error:"bad_request",message:"طلب غير صالح."},400);
const admin=createClient(Deno.env.get("SUPABASE_URL")!,Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
const dr=await admin.from("knowledge_docs").select("*").eq("id",doc_id).maybeSingle();
const row:any=dr.data;const dd:any=(row&&row.data)||{};
const wsId=body.workspace_id||(row?row.workspace_id:null);
// وضع الحذف الكامل: مقاطع + مستند
if(body.delete===true){
const d1=await admin.from("knowledge_chunks").delete().eq("doc_id",doc_id);
if(d1.error)return json({error:"delete",message:"فشل حذف المقاطع: "+d1.error.message},500);
const d2=await admin.from("knowledge_docs").delete().eq("id",doc_id);
if(d2.error)return json({error:"delete",message:"فشل حذف المستند: "+d2.error.message},500);
return json({ok:true,deleted:true});
}
const text=String(body.text||"").trim();
if(!text)return json({error:"empty",message:"النص فارغ."},422);
// تحديد الـ Agent: من الطلب، وإلا من knowledge_docs.data.agentId
let agentId=body.agent_id||null;
if(!agentId)agentId=dd.agentId||null;
let targets:string[]=[];
if(agentId)targets=[agentId];
else{
const ar=await admin.from("agents").select("id").eq("workspace_id",wsId);
targets=(ar.data||[]).map((a:any)=>a.id);
}
if(!targets.length)return json({error:"no_agent",message:"لا يوجد Agent لربط المعرفة به. أنشئ Agent أولًا."},422);
const chunks=chunkText(text).slice(0,400);
const genAI=new GoogleGenerativeAI(Deno.env.get("GEMINI_API_KEY")!);
const embModel=genAI.getGenerativeModel({model:"text-embedding-004"});
await admin.from("knowledge_chunks").delete().eq("doc_id",doc_id);
const rows:any[]=[];
for(let i=0;i<chunks.length;i+=20){
const batch=chunks.slice(i,i+20);
const r=await embModel.batchEmbedContents(batch.map(c=>({content:c})));
r.embeddings.forEach((e:any,j:number)=>{targets.forEach(tg=>rows.push({workspace_id:wsId,doc_id,content:batch[j],embedding:e.values,agent_id:tg}));});
}
const ins=await admin.from("knowledge_chunks").insert(rows);
if(ins.error)return json({error:"insert",message:"فشل تخزين المقاطع: "+ins.error.message},500);
// تحديث الحالة إلى ready فقط بعد نجاح الإدخال الفعلي
if(row){dd.status="ready";dd.chunkCount=chunks.length;dd.lastSync=Date.now();dd.error="";
await admin.from("knowledge_docs").update({data:dd}).eq("id",doc_id);}
return json({ok:true,chunks:chunks.length});
}catch(err){console.error("kb-ingest error",err);return json({error:"server",message:"فشل حفظ المعرفة: "+(err?.message||String(err))},500);}
});
</script>
<script type="text/plain" id="src-kbproc">
// supabase/functions/kb-process/index.ts — يستقبل { doc_id, path, name, agent_id }
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
import { extractText, getDocumentProxy } from "npm:unpdf";
import mammoth from "npm:mammoth";
import * as XLSX from "npm:xlsx";
const json=(b,s=200)=>new Response(JSON.stringify(b),{status:s,headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}});
function chunkText(text:string,size=800,overlap=100){const clean=text.replace(/\s+/g," ").trim();const out:string[]=[];for(let i=0;i<clean.length;i+=size-overlap){const c=clean.slice(i,i+size).trim();if(c.length>20)out.push(c);}return out;}
async function extractByType(name:string,buf:Uint8Array){
const ext=(name.split(".").pop()||"").toLowerCase();
try{
if(ext==="pdf"){const pdf=await getDocumentProxy(buf.slice().buffer);const {text}=await extractText(pdf,{mergePages:true});return Array.isArray(text)?text.join("\n"):text;}
if(ext==="docx")return (await mammoth.extractRawText({buffer:buf.slice().buffer})).value;
if(ext==="csv"||ext==="txt"||ext==="md")return new TextDecoder("utf-8").decode(buf);
if(ext==="xlsx"||ext==="xls"){const wb=XLSX.read(buf.slice().buffer,{type:"array"});let out="";for(const sn of wb.SheetNames)out+="\n["+sn+"]\n"+XLSX.utils.sheet_to_csv(wb.Sheets[sn]);return out;}
}catch(e:any){throw new Error("فشل استخراج النص من الملف ("+ext+"): "+(e?.message||String(e)));}
throw new Error("نوع الملف غير مدعوم: "+ext);
}
Deno.serve(async(req)=>{
if(req.method==="OPTIONS")return new Response("ok",{headers:{"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"*"}});
try{
const {doc_id,path,agent_id}=await req.json().catch(()=>({}));
if(!doc_id||!path)return json({error:"bad_request",message:"طلب غير صالح."},400);
const admin=createClient(Deno.env.get("SUPABASE_URL")!,Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
const {data:file,error:dlErr}=await admin.storage.from("kb-files").download(path);
if(dlErr||!file)return json({error:"download",message:"تعذر قراءة الملف من التخزين: "+(dlErr?.message||"")},500);
const buf=new Uint8Array(await file.arrayBuffer());
const text=await extractByType(path.split("/").pop()||"file",buf);
if(!text||!text.trim())return json({error:"empty",message:"الملف لا يحتوي نصًا قابلًا للاستخراج."},422);
// تحديد الـ Agent: من الطلب، وإلا من knowledge_docs.data.agentId (fallback آمن)
const dr=await admin.from("knowledge_docs").select("*").eq("id",doc_id).maybeSingle();
const row:any=dr.data;const dd:any=(row&&row.data)||{};
let agentId=agent_id||null;
if(!agentId)agentId=dd.agentId||null;
const wsId=row?row.workspace_id:null;
let targets:string[]=[];
if(agentId)targets=[agentId];
else{const ar=await admin.from("agents").select("id").eq("workspace_id",wsId);targets=(ar.data||[]).map((a:any)=>a.id);}
if(!targets.length)return json({error:"no_agent",message:"لا يوجد Agent لربط المعرفة به."},422);
const chunks=chunkText(text).slice(0,400);
const genAI=new GoogleGenerativeAI(Deno.env.get("GEMINI_API_KEY")!);
const embModel=genAI.getGenerativeModel({model:"text-embedding-004"});
await admin.from("knowledge_chunks").delete().eq("doc_id",doc_id);
const rows:any[]=[];
for(let i=0;i<chunks.length;i+=20){
const batch=chunks.slice(i,i+20);
const r=await embModel.batchEmbedContents(batch.map(c=>({content:c})));
r.embeddings.forEach((e:any,j:number)=>{targets.forEach(tg=>rows.push({workspace_id:wsId,doc_id,content:batch[j],embedding:e.values,agent_id:tg}));});
}
const ins=await admin.from("knowledge_chunks").insert(rows);
if(ins.error)return json({error:"insert",message:"فشل إنشاء التضمينات أو تخزين المقاطع: "+ins.error.message},500);
if(row){dd.status="ready";dd.chunkCount=chunks.length;dd.lastSync=Date.now();dd.error="";
await admin.from("knowledge_docs").update({data:dd}).eq("id",doc_id);}
return json({ok:true,chunks:chunks.length,summary:"تمت المعالجة وتخزين التضمينات."});
}catch(err){console.error("kb-process error",err);return json({error:"server",message:err?.message||"فشل في معالجة الملف."},500);}
});
</script>
<script type="text/plain" id="src-crawl">
// supabase/functions/kb-crawl/index.ts — زحف حتى 10 صفحات ضمن نفس النطاق
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
import { parse } from "npm:node-html-parser";
const json=(b,s=200)=>new Response(JSON.stringify(b),{status:s,headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}});
const MAX_PAGES=10;
function chunkText(text:string,size=800,overlap=100){const clean=text.replace(/\s+/g," ").trim();const out:string[]=[];for(let i=0;i<clean.length;i+=size-overlap){const c=clean.slice(i,i+size).trim();if(c.length>20)out.push(c);}return out;}
function extractPage(html:string){const root=parse(html);
root.querySelectorAll("script,style,noscript,svg,iframe,nav,footer,form,button").forEach(n=>n.remove());
const links=root.querySelectorAll("a[href]").map(a=>a.getAttribute("href")||"").filter(h=>h&&!h.startsWith("#")&&!h.startsWith("mailto:")&&!h.startsWith("tel:")&&!h.startsWith("javascript:"));
const title=(root.querySelector("title")?.text||"").trim();
const body=root.querySelector("main")||root.querySelector("body");
return {text:((title?title+"\n":"")+(body?.text||"")).replace(/\s+/g," ").trim(),links};}
Deno.serve(async(req)=>{
if(req.method==="OPTIONS")return new Response("ok",{headers:{"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"*"}});
try{
const {url,doc_id,workspace_id,agent_id}=await req.json().catch(()=>({}));
if(!url||!doc_id)return json({error:"bad_request",message:"طلب غير صالح."},400);
if(!/^https?:\/\//i.test(url))return json({error:"bad_url",message:"الرابط يجب أن يبدأ بـ http أو https."},400);
const origin=new URL(url).origin;
const queue:string[]=[url];const visited=new Set<string>();const pages:string[]=[];
while(queue.length&&visited.size<MAX_PAGES){
const next=queue.shift()!;let u:URL;try{u=new URL(next,origin);}catch{continue;}
const key=u.origin+u.pathname;
if(u.origin!==origin||visited.has(key))continue;
visited.add(key);
try{const res=await fetch(u.toString(),{headers:{"User-Agent":"SocialBot/1.0"},redirect:"follow",signal:AbortSignal.timeout(15000)});
if(!res.ok){console.warn("crawl page failed:",res.status,u.toString());continue;}
const ct=res.headers.get("content-type")||"";
if(!ct.includes("html"))continue;
const {text,links}=extractPage(await res.text());
if(text.length>40)pages.push("صفحة: "+u.pathname+"\n"+text.slice(0,20000));
for(const l of links)queue.push(new URL(l,u.toString()).toString());
}catch(fetchErr){console.warn("crawl fetch error:",fetchErr);continue;}
}
if(!pages.length)return json({error:"empty",message:"الموقع لا يحتوي نصًا كافيًا — قد يعتمد على JavaScript في عرض المحتوى أو يمنع القراءة الآلية."},422);
// تحديد الـ Agent: من الطلب، وإلا من knowledge_docs.data.agentId
const admin=createClient(Deno.env.get("SUPABASE_URL")!,Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
const dr=await admin.from("knowledge_docs").select("*").eq("id",doc_id).maybeSingle();
const row:any=dr.data;const dd:any=(row&&row.data)||{};
let agentId=agent_id||null;
if(!agentId)agentId=dd.agentId||null;
const wsId=workspace_id||(row?row.workspace_id:null);
let targets:string[]=[];
if(agentId)targets=[agentId];
else{const ar=await admin.from("agents").select("id").eq("workspace_id",wsId);targets=(ar.data||[]).map((a:any)=>a.id);}
if(!targets.length)return json({error:"no_agent",message:"لا يوجد Agent لربط المعرفة به."},422);
const chunks=chunkText(pages.join("\n")).slice(0,600);
const genAI=new GoogleGenerativeAI(Deno.env.get("GEMINI_API_KEY")!);
const embModel=genAI.getGenerativeModel({model:"text-embedding-004"});
await admin.from("knowledge_chunks").delete().eq("doc_id",doc_id);
const rows:any[]=[];
for(let i=0;i<chunks.length;i+=20){
const batch=chunks.slice(i,i+20);
const r=await embModel.batchEmbedContents(batch.map(c=>({content:c})));
r.embeddings.forEach((e:any,j:number)=>{targets.forEach(tg=>rows.push({workspace_id:wsId,doc_id,content:batch[j],embedding:e.values,agent_id:tg}));});
}
const ins=await admin.from("knowledge_chunks").insert(rows);
if(ins.error)return json({error:"insert",message:"فشل تخزين المقاطع: "+ins.error.message},500);
if(row){dd.status="ready";dd.chunkCount=chunks.length;dd.lastSync=Date.now();dd.pages=visited.size;dd.error="";
await admin.from("knowledge_docs").update({data:dd}).eq("id",doc_id);}
return json({ok:true,chunks:chunks.length,pages:visited.size});
}catch(err){console.error("kb-crawl error",err);return json({error:"server",message:"فشل الزحف: "+(err?.message||String(err))},500);}
});
</script>
<script type="text/plain" id="src-widgetjs">

/* تحميل مكتبات الـ CDN ديناميكيًا عند الحاجة (آلية آمنة لرفع الملفات) */
function loadScriptOnce(src,checkFn){
return new Promise(function(res,rej){
if(checkFn&&checkFn()){res();return}
function poll(n){if(checkFn&&checkFn()){res();return}if(n<=0){rej(new Error('انتهت مهلة تحميل المكتبة'));return}setTimeout(function(){poll(n-1)},100)}

s.onload=function(){poll(10)};

document.head.appendChild(s);});}

function classifyConvo(c){
const t=norm((c.messages||[]).filter(function(m){return m.from==='visitor'}).map(function(m){return String(m.text||'')})).join(' ');
let score=0;const tags=[];
if(/(سعر|بكم|يكلف|تكلف)/.test(t)){score+=10;tags.push('سأل عن السعر')}
if(/(توصيل|شحن|يوصل)/.test(t)){score+=15;tags.push('سأل عن التوصيل')}
if(/(دفع|فيزا|مدي|بطاقه|كاش|تحويل بنكي)/.test(t)){score+=20;tags.push('سأل عن الدفع')}
if(/(اريد اطلب|ابغي اطلب|ابى اطلب|اطلب الان|اشتري|اريد الشراء|احجز)/.test(t)){score+=40;tags.push('نية شراء')}
if(/(موظف|انسان|بشري)/.test(t))tags.push('طلب موظف');
score=Math.min(score,100);
let cls='استفسار عام';
if(c.status==='handoff')cls='يحتاج متابعة';
else if(score>=60)cls='مشتري';else if(score>=40)cls='عميل محتمل';else if(score>=15)cls='مهتم';
return {score:score,cls:cls,tags:tags};}

async function crawlLocal(url,doc){
const origin=new URL(url).origin;
const visited=new Set();const queue=[url];const pages=[];
while(queue.length&&visited.size<10){
const next=queue.shift();let u;try{u=new URL(next)}catch(e){continue}
const key=u.origin+u.pathname;
if(u.origin!==origin||visited.has(key))continue;
visited.add(key);
try{
const html=await fetchPage(u.toString());
const res=extractHtml(html,u.toString());
if(res.text.length>40)pages.push('صفحة: '+u.pathname+'\n'+res.text.slice(0,20000));
res.links.forEach(function(l){queue.push(l)});
}catch(e){/* تجاهل الصفحة الفاشلة وأكمل */}}
if(!pages.length)throw new Error('الموقع لا يحتوي نصًا كافيًا — قد يعتمد على JavaScript في عرض المحتوى');
doc.content=pages.join('\n').slice(0,60000);
chunkify(doc);doc.pages=visited.size;doc.status='ready';doc.lastSync=now();}

async function extractFileClient(file){
const ext=(file.name.split('.').pop()||'').toLowerCase();
/* نصوص صريحة */
if(ext==='txt'||ext==='csv'||ext==='md'){
const t=await file.text();
if(t&&t.trim())return t;
throw new Error('الملف فارغ أو بترميز غير مدعوم');}
/* PDF — تحميل ديناميكي للمكتبة + بديل آمن */
if(ext==='pdf'){
const ok=await ensureLib(function(){return !!window.pdfjsLib},['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js']);
if(ok){
try{
window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const buf=await file.arrayBuffer();
const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
let out='';
for(let i=1;i<=Math.min(pdf.numPages,200);i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();out+=tc.items.map(function(it){return it.str}).join(' ')+'\n';}
if(out.trim())return out;
}catch(e){console.warn('pdf primary extraction failed:',e)}}
/* Fallback: محاولة استخراج نصي مبسّط من بايتات الملف */
try{
const raw=await file.text();
const naive=raw.replace(/[^\u0600-\u06FFa-zA-Z0-9 \n.,()\-:%]/g,' ').replace(/ {3,}/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
if(naive.length>200)return naive;
}catch(e2){}
throw new Error('تعذر استخراج النص من ملف PDF — إن كان الملف مصورًا (صور ضوئية) فحوّله إلى PDF نصي أولًا');}
/* DOCX — mammoth + بديل JSZip */
if(ext==='docx'){
const ok=await ensureLib(function(){return !!window.mammoth},['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js','https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js']);
if(ok){
try{
const buf=await file.arrayBuffer();
const r=await window.mammoth.extractRawText({arrayBuffer:buf});
if(r.value&&r.value.trim())return r.value;
}catch(e){console.warn('mammoth extraction failed:',e)}}
const zok=await ensureLib(function(){return !!window.JSZip},['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']);
if(zok){
try{
const buf=await file.arrayBuffer();
const zip=await window.JSZip.loadAsync(buf);
const xf=zip.file('word/document.xml');
if(xf){
const xml=await xf.async('string');
const txt=xml.replace(/<w:tab[^>]*\/>/g,'\t').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'')
.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
if(txt)return txt;}
}catch(e2){console.warn('jszip docx fallback failed:',e2)}}
throw new Error('تعذر استخراج النص من ملف DOCX — جرّب تصديره كنص عادي (.txt)');}
/* Excel — SheetJS + بديل JSZip */
if(ext==='xlsx'||ext==='xls'){
const ok=await ensureLib(function(){return !!window.XLSX},['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js']);
if(ok){
try{
const buf=await file.arrayBuffer();
const wb=window.XLSX.read(buf,{type:'array'});
let out='';wb.SheetNames.forEach(function(sn){out+='\n['+sn+']\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[sn])});
if(out.trim())return out;
}catch(e){console.warn('xlsx extraction failed:',e)}}
const zok2=await ensureLib(function(){return !!window.JSZip},['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']);
if(zok2){
try{
const buf=await file.arrayBuffer();
const zip=await window.JSZip.loadAsync(buf);
const ss=zip.file('xl/sharedStrings.xml');
let out='';
if(ss){const xml=await ss.async('string');
const m=xml.match(/<t[^>]*>([^<]*)<\/t>/g)||[];
out=m.map(function(x){return x.replace(/<[^>]+>/g,'')}).join('\n');}
if(out.trim())return out;
}catch(e2){console.warn('jszip xlsx fallback failed:',e2)}}
throw new Error('تعذر استخراج البيانات من ملف Excel — جرّب تصديره بصيغة CSV');}
/* Fallback عام: محاولة قراءة الملف كنص لأي صيغة غير معروفة */
try{
const t=await file.text();
const clean=t.replace(/[^\u0600-\u06FFa-zA-Z0-9 \n.,()\-:%\r]/g,' ');
if(clean.trim().length>40)return clean;
}catch(e3){}
throw new Error('نوع الملف غير مدعوم: '+ext);}
