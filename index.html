function aiRespond(text,agent){
 const t=norm(text);
 if(HANDOFF.some(k=>t.includes(norm(k))))return {text:'أكيد، حولتك للموظف المختص الآن ✋ سيتابع معك خلال دقائق.',handoff:true};
 if(/^(سلام|هلا|مرحبا|اهلا|هاي|صباح|مساء)/.test(t))return {text:'أهلًا وسهلًا 👋 كيف أقدر أساعدك؟'};
 if(t.includes('شكرا')||t.includes('يعطيك العافيه'))return {text:'العفو 🤍 أي شيء ثاني أنا هنا.'};
 const hits=searchKB(text);
 if(hits.length&&hits[0].sc>=1)return {text:hits.map(h=>h.text).join('\n')};
 if(/(سعر|كم يكلف|بسعر|تكلفه|تكلفة)/.test(t))return {text:'ما عندي سعر مؤكد لهذا حاليًا 🙏 اسألني عن منتجاتنا أو سياساتنا، أو اطلب تحويلك لموظف.'};
 return {text:agent&&agent.fallback?agent.fallback:'عذرًا، ما قدرت أعالج طلبك حاليًا. حاول مرة ثانية بعد قليل.'};
}

function mountWidget(host,w,agent,opts){
 if(!host||!w)return null;
 opts=opts||{};
 const isRight=(opts.position||w.position)==='bottom-right';
 host.innerHTML='<div class="w-wrap flex flex-col items-end gap-3" style="position:'+(opts.fixed?'fixed':'absolute')+';'+(isRight?'right:16px':'left:16px')+';bottom:16px;z-index:60">'
  +'<div class="w-panel hidden">'+widgetMarkup(w,agent,{credit:opts.credit})+'</div>'
  +launcherMarkup(w)+'</div>';
 const panel=host.querySelector('.w-panel'),msgs=host.querySelector('.w-msgs'),form=host.querySelector('.w-form'),input=host.querySelector('.w-input');
 let convo=null,open=false,rl=[];
 const agentOf=()=>{if(agent)return agent;const s=ws();return s?s.agents.find(a=>a.id===w.agentId):null};
 function pushMsg(from,text){
   const el=document.createElement('div');
   if(from==='system'){el.className='msg-in flex';el.innerHTML='<div class="text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg px-3 py-1.5 w-full text-center">'+esc(text)+'</div>';}
   else{el.className='msg-in flex '+(from==='visitor'?'justify-start':'justify-end');
    el.innerHTML='<div class="max-w-[85%] text-sm leading-6 px-3.5 py-2.5 '+(from==='visitor'?'bg-ink-800 text-ink-100 rounded-2xl rounded-tr-sm':'text-white rounded-2xl rounded-tl-sm')+'" '+(from!=='visitor'?'style="background:'+w.primary+'"':'')+'>'+md(text)+'</div>';}
   msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;}
 function typing(on){let t=host.querySelector('.w-typing');
   if(on&&!t){t=document.createElement('div');t.className='w-typing typing flex gap-1 px-3 py-2 text-ink-400';t.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(t);msgs.scrollTop=msgs.scrollHeight}
   if(!on&&t)t.remove()}
 function ensureConvo(){if(convo||!opts.persist||!ws())return;
   let vid=localStorage.getItem('aown_vid');if(!vid){vid=uid('v_');localStorage.setItem('aown_vid',vid)}
   let c=ws().contacts.find(x=>x.vid===vid);
   if(!c){c={id:uid('c_'),vid:vid,name:'زائر '+vid.slice(-4),email:'',phone:'',firstSeen:now(),lastSeen:now(),tags:[],notes:''};ws().contacts.unshift(c)}
   c.lastSeen=now();
   convo={id:uid('cv_'),contactId:c.id,agentId:w.agentId,widgetId:w.id,status:'active',createdAt:now(),updatedAt:now(),messages:[]};
   ws().convos.unshift(convo);save()}
 function openPanel(){open=true;panel.classList.remove('hidden');
   const l=host.querySelector('[data-action="w-open"]');if(l)l.classList.add('hidden');
   if(!msgs.children.length)pushMsg('ai',w.welcome||((agentOf()&&agentOf().welcome)||'أهلًا 👋'));
   ensureConvo();
   setTimeout(()=>{if(input)input.focus()},50)}
 function closePanel(){open=false;panel.classList.add('hidden');
   const l=host.querySelector('[data-action="w-open"]');if(l)l.classList.remove('hidden')}
 host.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;
   if(b.dataset.action==='w-open')openPanel();
   if(b.dataset.action==='w-close')closePanel()});
 if(form)form.addEventListener('submit',e=>{e.stopPropagation();e.preventDefault();
   const text=input.value.trim();if(!text)return;
   if(text.length>500){pushMsg('system','الرسالة طويلة جدًا، اختصرها قليلًا.');return}
   rl.push(now());rl=rl.filter(x=>now()-x<2e4);
   if(rl.length>5){pushMsg('system','تمهل قليلًا 🙂 أرسلت رسائل كثيرة في وقت قصير.');return}
   input.value='';pushMsg('visitor',text);
   if(convo){convo.messages.push({from:'visitor',text:text,at:now()});convo.updatedAt=now();save()}
   typing(w.typing!==false);
   setTimeout(()=>{typing(false);
     const res=aiRespond(text,agentOf());
     if(opts.persist&&convo){
       if(res.handoff){convo.status='handoff'}
       convo.messages.push({from:'ai',text:res.text,at:now()});convo.updatedAt=now();
       if(ws())ws().usage.ai++;
       save();
     }
     if(convo&&convo.status==='handoff'&&!res.handoff){pushMsg('system','هذه المحادثة بيد فريق الدعم الآن، سيتولى زميل بشري الرد.');return}
     pushMsg('ai',res.text);
     if(w.sound)beep();
     if(res.handoff)pushMsg('system','تم تحويل المحادثة إلى فريق الدعم ✋');
   },700+Math.random()*700)});
 if(w.autoOpen)setTimeout(()=>{if(!open)openPanel()},(w.delay||3)*1000);
 return {openPanel,closePanel};
}

function go(h){if(location.hash===h)route();else location.hash=h}
function route(){
 const h=location.hash||'#/';
 try{
   if(h.indexOf('#/app')===0){if(!me()){go('#/login');return}renderDash(h)}
   else if(h==='#/login')renderAuth('login');
   else if(h==='#/signup')renderAuth('signup');
   else if(h==='#/forgot')renderAuth('forgot');
   else if(h.indexOf('#/test')===0)renderTest();
   else renderLanding();

}
window.addEventListener('hashchange',route);

 if(tgt.id==='w-avatar-file'||tgt.id==='w-logo-file'){var f=tgt.files[0];if(!f||!draft)return;var r=new FileReader();
  r.onload=function(){if(tgt.id==='w-avatar-file')draft.avatar=r.result;else draft.logo=r.result;route()};r.readAsDataURL(f);return}
 if(tgt.id==='kb-file'){var f2=tgt.files[0];if(!f2)return;var isTxt=/\.(txt|csv)$/i.test(f2.name);
  var done=function(content){var doc={id:uid('kb_'),name:f2.name,type:'file',content:content||('مستند «'+f2.name+'» — تم استخراج النص ومعالجته.'),createdAt:now()};chunkify(doc);ws().kb.unshift(doc);save();toast('تمت معالجة الملف وتقسيمه إلى '+doc.chunks.length+' مقطع','ok');route()};
  if(isTxt){var r2=new FileReader();r2.onload=function(){done(r2.result)};r2.readAsText(f2)}else setTimeout(function(){done('')},600);
  tgt.value='';return}
 var b=tgt.dataset?tgt.dataset.b:null;
 if(!b||!draft)return;
 draft[b]=tgt.type==='checkbox'?tgt.checked:tgt.value;
 route();
});
document.addEventListener('submit',function(e){
 var f=e.target;if(!f||!f.id)return;
 if(f.id.indexOf('f-')!==0&&f.id!=='f-agent')return;
 var isWidgetForm=f.classList&&f.classList.contains('w-form');
 if(isWidgetForm)return;
 e.preventDefault();
 var fd=new FormData(f);
 try{
 if(f.id==='f-login'){var u=db.users.find(function(x){return x.email===fd.get('email')&&x.pw===hashPw(fd.get('pass'))});
   if(!u){toast('بيانات الدخول غير صحيحة','err');return}
   db.session=u.id;save();toast('مرحبًا بعودتك 👋','ok');go('#/app')}
 else if(f.id==='f-signup'){var em=String(fd.get('email')).trim();
   if(db.users.some(function(x){return x.email===em})){toast('البريد مسجل مسبقًا','err');return}
   var nu={id:uid('u_'),name:String(fd.get('name')).trim(),email:em,pw:hashPw(fd.get('pass')),createdAt:now()};
   db.users.push(nu);db.session=nu.id;db.ws=starterKit();db.ws.settings.name=String(fd.get('company')).trim();db.ws.settings.type=fd.get('type');save();
   toast('تم إنشاء مساحة عملك 🎉','ok');go('#/app')}
 else if(f.id==='f-forgot'){var fu=db.users.find(function(x){return x.email===String(fd.get('email')).trim()});
   if(!fu){toast('البريد غير موجود','err');return}
   modal('<h3 class="font-display font-bold mb-2">إعادة التعيين</h3><p class="text-xs text-ink-400 mb-4">تم إرسال رابط الاستعادة إلى بريدك. (وضع العرض: عيّن كلمة مرور جديدة مباشرة)</p><form id="f-reset"><input type="hidden" name="uid" value="'+fu.id+'"><label class="lbl2">كلمة المرور الجديدة<input name="pass" minlength="6" required type="password" class="inp-s"></label><button class="btn-primary w-full mt-3">تعيين كلمة المرور</button></form>')}
 else if(f.id==='f-reset'){var ru=db.users.find(function(x){return x.id===fd.get('uid')});if(ru){ru.pw=hashPw(fd.get('pass'));save()}closeModal();toast('تم تحديث كلمة المرور','ok');go('#/login')}
 else if(f.id==='f-agent'){var idv=fd.get('id');var data=Object.fromEntries(fd);
   if(idv){var ea=ws().agents.find(function(x){return x.id===idv});if(ea)Object.assign(ea,data)}
   else ws().agents.push(Object.assign({},data,{id:uid('ag_'),createdAt:now()}));
   save();closeModal();toast('تم حفظ الـ Agent','ok');route()}
 else if(f.id==='f-widget'){var nw=defWidget(fd.get('agentId'),String(fd.get('name')).trim());ws().widgets.push(nw);save();closeModal();draft=null;go('#/app/builder?id='+nw.id)}
 else if(f.id==='f-dash-msg'){var cd=ws().convos.find(function(x){return x.id===selConvo});if(!cd)return;
   var txt=String(fd.get('m')||'').trim();if(!txt)return;
   cd.messages.push({from:'team',text:txt,at:now()});cd.updatedAt=now();save();route()}
 else if(f.id==='f-kb-text'){var doc={id:uid('kb_'),name:String(fd.get('title')).trim(),type:'text',content:String(fd.get('content')).trim(),createdAt:now()};chunkify(doc);ws().kb.unshift(doc);save();toast('تمت المعالجة: '+doc.chunks.length+' مقطع','ok');route()}
 else if(f.id==='f-kb-url'){var du={id:uid('kb_'),name:String(fd.get('url')),type:'url',content:'محتوى مستخرج من '+fd.get('url')+' — صفحات: الرئيسية، المنتجات، التواصل. (محاكاة زحف)',createdAt:now()};chunkify(du);ws().kb.unshift(du);save();toast('تم الزحف ومعالجة الرابط','ok');route()}
 else if(f.id==='f-team'){ws().settings.team.push({email:String(fd.get('email')).trim(),role:'عضو'});save();toast('تمت دعوة العضو','ok');route()}
 }catch(err){console.error(err);toast('تعذر تنفيذ العملية','err')}
});

/* ================= Boot ================= */
loadDB();
route();
</script>
