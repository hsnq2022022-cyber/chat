<!-- ============================================================
     مراجع SQL و Edge Functions للمستخدم (للنسخ إلى Supabase)
     هذه المراجع للعرض فقط — يجب نسخها يدويًا إلى Supabase
     ============================================================ -->

<script type="text/plain" id="src-sql2">
-- =============================================
-- ترحيل قاعدة البيانات — شغّله في SQL Editor
-- =============================================
create extension if not exists vector;

-- جدول knowledge_chunks
create table if not exists public.knowledge_chunks (
  id uuid primary key default gen_random_uuid(),
  workspace_id uuid not null references public.workspaces(id) on delete cascade,
  doc_id text not null,
  content text not null,
  embedding vector(768),
  agent_id text,
  created_at timestamptz default now()
);

create index if not exists chunks_ws_idx on public.knowledge_chunks(workspace_id);
create index if not exists chunks_doc_idx on public.knowledge_chunks(doc_id);
create index if not exists chunks_agent_idx on public.knowledge_chunks(agent_id);
create index if not exists chunks_hnsw_idx on public.knowledge_chunks using hnsw (embedding vector_cosine_ops);

alter table public.knowledge_chunks enable row level security;
drop policy if exists chunks_member on public.knowledge_chunks;
create policy chunks_member on public.knowledge_chunks for all
  using (workspace_id in (select id from public.workspaces where owner_id = auth.uid()))
  with check (workspace_id in (select id from public.workspaces where owner_id = auth.uid()));

-- دالة زيادة استخدام AI
create or replace function public.increment_ai_usage(wsid uuid) returns void language sql security definer as $$
  update public.workspaces set usage_ai = usage_ai + 1 where id = wsid;
$$;

-- دالة حد الوكلاء (الخطة المجانية = 8 وكلاء)
create or replace function public.enforce_agent_limit() returns trigger language plpgsql security definer as $$
declare v_plan text; v_count int; v_limit int;
begin
  select plan into v_plan from public.workspaces where id = NEW.workspace_id;
  -- الخطة المجانية = 8 وكلاء
  v_limit := case when v_plan='growth' then 25 when v_plan='pro' then 999 else 8 end;
  select count(*) into v_count from public.agents where workspace_id = NEW.workspace_id;
  if v_count >= v_limit then raise exception 'AGENT_LIMIT_REACHED'; end if;
  return NEW;
end; $$;

drop trigger if exists trg_agent_limit on public.agents;
create trigger trg_agent_limit before insert on public.agents for each row execute function public.enforce_agent_limit();

-- دالة البحث المتجهي مع عزل الـ Agent
create or replace function public.match_kb_chunks_agent(ws uuid, ag text, q vector, match_count int default 4)
returns table (doc_id text, content text, similarity float) language sql stable as $$
  select c.doc_id, c.content, 1 - (c.embedding <=> q) as similarity
  from public.knowledge_chunks c
  where c.workspace_id = ws and c.embedding is not null
    and (c.agent_id is null or c.agent_id = ag)
  order by c.embedding <=> q limit match_count;
$$;

-- حاوية التخزين
insert into storage.buckets (id,name,public) values ('kb-files','kb-files',false) on conflict (id) do nothing;
drop policy if exists kb_files_member on storage.objects;
create policy kb_files_member on storage.objects for all
  using (bucket_id='kb-files' and (auth.uid() in (select owner_id from public.workspaces where id::text=(storage.foldername(name))[1])))
  with check (bucket_id='kb-files' and (auth.uid() in (select owner_id from public.workspaces where id::text=(storage.foldername(name))[1])));
</script>

<script type="text/plain" id="src-ai">
// =============================================
// supabase/functions/ai-respond/index.ts
// RAG كامل: تضمين السؤال → بحث متجهي → سياق → Gemini
// =============================================
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";

const CORS = {
  "Access-Control-Allow-Origin": "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, api-key, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS"
};
const json = (b: unknown, s = 200) => new Response(JSON.stringify(b), {
  status: s,
  headers: { ...CORS, "Content-Type": "application/json" }
});

const PLAN_LIMITS: Record<string, number> = { free: 500, growth: 5000, pro: 50000 };
const HANDOFF = ["موظف", "انسان", "بشري", "شخص حقيقي", "مختص", "مسؤول"];
const norm = (s: string) => s.replace(/[\u064B-\u0652\u0640]/g, "")
  .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").toLowerCase();

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: CORS });
  try {
    const { widget_id, token, message, conversation_id } = await req.json().catch(() => ({}));
    if (!widget_id || !token) return json({ error: "bad_request" }, 400);
    const text = String(message ?? "").trim();
    if (!text) return json({ error: "empty" }, 400);
    if (text.length > 500) return json({ error: "too_long" }, 400);

    const admin = createClient(
      Deno.env.get("SUPABASE_URL")!,
      Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!
    );

    // 1) التحقق من الويدجت
    const { data: widgetRow } = await admin.from("widgets")
      .select("*").eq("id", String(widget_id)).maybeSingle();
    const wd: any = widgetRow?.data ?? {};
    if (!widgetRow || typeof wd.token !== "string" || wd.token !== String(token))
      return json({ error: "invalid_widget" }, 403);
    if (wd.enabled === false) return json({ error: "disabled" }, 403);
    if (!wd.agentId) return json({ error: "no_agent" }, 500);

    const wsId = widgetRow.workspace_id;
    const agentId = String(wd.agentId);

    // 2) التحقق من مساحة العمل والحد
    const { data: wsRow } = await admin.from("workspaces")
      .select("*").eq("id", wsId).maybeSingle();
    if (!wsRow) return json({ error: "no_workspace" }, 404);
    if ((wsRow.usage_ai || 0) >= (PLAN_LIMITS[wsRow.plan || "free"] ?? 500))
      return json({ error: "limit", message: "تم تجاوز الحد الشهري." }, 429);

    // 3) التحقق من الـ Agent
    const { data: agentRow } = await admin.from("agents")
      .select("*").eq("id", agentId).maybeSingle();
    if (!agentRow) return json({ error: "no_agent" }, 500);
    const ad: any = agentRow.data ?? {};

    // 4) المحادثة
    let conv: any = null;
    if (conversation_id) {
      const r = await admin.from("conversations").select("*")
        .eq("id", String(conversation_id)).maybeSingle();
      conv = r.data || null;
    }
    const cd: any = conv?.data || { status: "active", messages: [], contactId: null };

    // 5) Handoff
    if (cd.status === "handoff" && !HANDOFF.some(k => norm(text).includes(norm(k))))
      return json({ handoff_locked: true, message: "المحادثة بيد فريق الدعم." });

    if (HANDOFF.some(k => norm(text).includes(norm(k)))) {
      cd.status = "handoff";
      cd.messages = cd.messages || [];
      cd.messages.push({ from: "visitor", text, at: Date.now() });
      cd.updatedAt = Date.now();
      if (conv) await admin.from("conversations").update({ data: cd }).eq("id", conv.id);
      return json({ reply: "حولتك للموظف المختص الآن ✋", handoff: true });
    }

    // 6) Gemini + RAG
    const apiKey = Deno.env.get("GEMINI_API_KEY");
    if (!apiKey) return json({ error: "server" }, 500);
    const genAI = new GoogleGenerativeAI(apiKey);

    // 7) تضمين السؤال
    const qVec = (await genAI.getGenerativeModel({ model: "text-embedding-004" })
      .embedContent(text)).embedding.values as number[];

    // 8) البحث المتجهي مع عزل الـ Agent
    const { data: hits } = await admin.rpc("match_kb_chunks_agent", {
      ws: wsId, ag: agentId, q: qVec, match_count: 4
    });

    // 9) فلترة بالتشابه
    const context = (hits || []).filter((h: any) => h.similarity >= 0.55)
      .map((h: any) => h.content).join("\n---\n");

    // 10) سياق المحادثة
    const history = (cd.messages || []).slice(-10)
      .filter((m: any) => m.from === "visitor" || m.from === "ai")
      .map((m: any) => ({
        role: m.from === "visitor" ? "user" as const : "model" as const,
        parts: [{ text: String(m.text) }]
      }));

    // 11) Prompt صارم — لا اختراع
    const sysParts = [
      ad.instructions || "أنت مساعد خدمة عملاء.",
      "أنت تعمل ضمن نطاق هذا النشاط فقط.",
      "إذا لم تكن المعلومة موجودة في السياق، قل بوضوح إنك لا تملكها.",
      "ممنوع اختراع أسعار أو منتجات أو خدمات أو مواعيد أو سياسات.",
      context
        ? "المعلومات الموثقة:\n" + context
        : "لا توجد معلومات ذات صلة. اعتذر بلباقة ولا تخترع إجابة."
    ];
    const sys = sysParts.join("\n\n");

    const model = genAI.getGenerativeModel({
      model: ad.model || "gemini-2.5-flash-lite",
      systemInstruction: sys
    });
    const chat = model.startChat({ history });
    const res = await chat.sendMessage(text);
    const reply = res.response.text().trim() ||
      (ad.fallback || "عذرًا، ما عندي معلومات عن هذا.");

    // 12) حفظ المحادثة
    cd.messages = cd.messages || [];
    cd.messages.push(
      { from: "visitor", text, at: Date.now() },
      { from: "ai", text: reply, at: Date.now() }
    );
    cd.updatedAt = Date.now();
    if (conv) await admin.from("conversations").update({ data: cd }).eq("id", conv.id);
    await admin.rpc("increment_ai_usage", { wsid: wsId });

    return json({ reply, handoff: false, conversation_id: conv?.id || null });
  } catch (err) {
    console.error(err);
    return json({ error: "server", message: "عذرًا، حصل خطأ مؤقت." }, 500);
  }
});
</script>

<script type="text/plain" id="src-verify">
// =============================================
// supabase/functions/verify-widget/index.ts
// =============================================
import { createClient } from "npm:@supabase/supabase-js@2";
const CORS = {
  "Access-Control-Allow-Origin": "*",
  "Access-Control-Allow-Headers": "authorization, x-client-info, api-key, content-type",
  "Access-Control-Allow-Methods": "POST, OPTIONS"
};
const json = (b: unknown, s = 200) => new Response(JSON.stringify(b), {
  status: s,
  headers: { ...CORS, "Content-Type": "application/json" }
});

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", { headers: CORS });
  try {
    const { widget_id, token } = await req.json().catch(() => ({}));
    if (!widget_id || !token) return json({ error: "bad_request" }, 400);
    const admin = createClient(
      Deno.env.get("SUPABASE_URL")!,
      Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!
    );
    const { data: widgetRow } = await admin.from("widgets")
      .select("id, workspace_id, data").eq("id", String(widget_id)).maybeSingle();
    if (!widgetRow) return json({ error: "invalid_widget" }, 403);
    const wd: any = widgetRow.data ?? {};
    if (typeof wd.token !== "string" || wd.token !== String(token))
      return json({ error: "invalid_widget" }, 403);
    if (wd.enabled === false) return json({ error: "disabled" }, 403);
    if (!wd.agentId) return json({ error: "no_agent" }, 500);

    const { data: agentRow } = await admin.from("agents")
      .select("data").eq("id", String(wd.agentId)).maybeSingle();
    const ad: any = agentRow?.data ?? {};
    const { data: wsRow } = await admin.from("workspaces")
      .select("plan").eq("id", widgetRow.workspace_id).maybeSingle();

    return json({
      ok: true, widget_id,
      agent: { name: ad.name || "مساعدك الذكي", avatar: ad.avatar || "" },
      settings: {
        name: wd.name || ad.name || "مساعدك الذكي",
        welcome: wd.welcome || ad.welcome || "أهلًا بك 👋",
        placeholder: wd.placeholder || "اكتب رسالتك...",
        offline: wd.offline || "نحن غير متصلين.",
        primary: wd.primary || "#0ABAB5", secondary: wd.secondary || "#0b514f",
        bg: wd.bg || "#1a1e24", userBg: wd.userBg || "#22272f",
        aiBg: wd.aiBg || "", text: wd.text || "#e8eaed",
        shadow: wd.shadow !== false, border: !!wd.border,
        buttonSize: typeof wd.buttonSize === "number" ? wd.buttonSize : 56,
        radius: typeof wd.radius === "number" ? wd.radius : 16,
        width: typeof wd.width === "number" ? wd.width : 360,
        height: typeof wd.height === "number" ? wd.height : 520,
        position: wd.position || "bottom-left",
        avatar: wd.avatar || ad.avatar || "", logo: wd.logo || "",
        online: wd.online !== false, typing: wd.typing !== false,
        autoOpen: !!wd.autoOpen,
        delay: typeof wd.delay === "number" ? wd.delay : 3,
        badge: wd.badge !== false, sound: !!wd.sound,
        mobile: wd.mobile === "full" ? "full" : "panel",
        credit: (wsRow?.plan || "free") === "free"
      }
    });
  } catch (err) {
    console.error(err);
    return json({ error: "server" }, 500);
  }
});
</script>

<script type="text/plain" id="src-kbproc">
// =============================================
// supabase/functions/kb-process/index.ts
// =============================================
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
import { extractText, getDocumentProxy } from "npm:unpdf";
import mammoth from "npm:mammoth";
import * as XLSX from "npm:xlsx";

const json = (b: unknown, s = 200) => new Response(JSON.stringify(b), {
  status: s,
  headers: { "Content-Type": "application/json", "Access-Control-Allow-Origin": "*" }
});

function chunkText(text: string, size = 800, overlap = 100): string[] {
  const clean = text.replace(/\s+/g, " ").trim();
  const out: string[] = [];
  for (let i = 0; i < clean.length; i += size - overlap) {
    const c = clean.slice(i, i + size).trim();
    if (c.length > 20) out.push(c);
  }
  return out;
}

async function extractByType(name: string, buf: Uint8Array): Promise<string> {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "pdf") {
    const pdf = await getDocumentProxy(buf.slice().buffer);
    const { text } = await extractText(pdf, { mergePages: true });
    return Array.isArray(text) ? text.join("\n") : text;
  }
  if (ext === "docx") return (await mammoth.extractRawText({ buffer: buf.slice().buffer })).value;
  if (ext === "csv" || ext === "txt" || ext === "md") return new TextDecoder("utf-8").decode(buf);
  if (ext === "xlsx" || ext === "xls") {
    const wb = XLSX.read(buf.slice().buffer, { type: "array" });
    let out = "";
    for (const sn of wb.SheetNames) out += "\n[" + sn + "]\n" + XLSX.utils.sheet_to_csv(wb.Sheets[sn]);
    return out;
  }
  throw new Error("نوع الملف غير مدعوم: " + ext);
}

Deno.serve(async (req) => {

<script type="text/plain" id="src-crawl">
// =============================================
// supabase/functions/kb-crawl/index.ts
// =============================================
import { createClient } from "npm:@supabase/supabase-js@2";
import { GoogleGenerativeAI } from "npm:@google/generative-ai";
import { parse } from "npm:node-html-parser";

const json = (b: unknown, s = 200) => new Response(JSON.stringify(b), {
  status: s,
  headers: { "Content-Type": "application/json", "Access-Control-Allow-Origin": "*" }
});
const MAX_PAGES = 10;

function chunkText(text: string, size = 800, overlap = 100): string[] {
  const clean = text.replace(/\s+/g, " ").trim();
  const out: string[] = [];
  for (let i = 0; i < clean.length; i += size - overlap) {
    const c = clean.slice(i, i + size).trim();
    if (c.length > 20) out.push(c);
  }
  return out;
}

function extractPage(html: string) {
  const root = parse(html);
  root.querySelectorAll("script,style,noscript,svg,iframe,nav,footer,form,button")
    .forEach(n => n.remove());
  const links = root.querySelectorAll("a[href]")
    .map(a => a.getAttribute("href") || "")
    .filter(h => h && !h.startsWith("#") && !h.startsWith("mailto:")
      && !h.startsWith("tel:") && !h.startsWith("javascript:"));
  const title = (root.querySelector("title")?.text || "").trim();
  const body = root.querySelector("main") || root.querySelector("body");
  return {
    text: ((title ? title + "\n" : "") + (body?.text || "")).replace(/\s+/g, " ").trim(),
    links
  };
}

Deno.serve(async (req) => {
  if (req.method === "OPTIONS") return new Response("ok", {
    headers: { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Headers": "*" }
  });
  try {
    const { url, doc_id, workspace_id, agent_id } = await req.json().catch(() => ({}));
    if (!url || !doc_id) return json({ error: "bad_request" }, 400);
    if (!/^https?:\/\//i.test(url)) return json({ error: "bad_url" }, 400);

    const admin = createClient(
      Deno.env.get("SUPABASE_URL")!,
      Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!
    );
    const origin = new URL(url).origin;
    const queue: string[] = [url];
    const visited = new Set<string>();
    const pages: string[] = [];

    while (queue.length && visited.size < MAX_PAGES) {
      const next = queue.shift()!;
      let u: URL;
      try { u = new URL(next, origin); } catch { continue; }
      const key = u.origin + u.pathname;
      if (u.origin !== origin || visited.has(key)) continue;
      visited.add(key);
      try {
        const res = await fetch(u.toString(), {
          headers: { "User-Agent": "AwnBot/1.0" },
          redirect: "follow",
          signal: AbortSignal.timeout(15000)
        });
        if (!res.ok) continue;
        const ct = res.headers.get("content-type") || "";
        if (!ct.includes("html")) continue;
        const { text, links } = extractPage(await res.text());
        if (text.length > 40) pages.push("صفحة: " + u.pathname + "\n" + text.slice(0, 20000));
        for (const l of links) queue.push(new URL(l, u.toString()).toString());
      } catch { continue; }
    }
    if (!pages.length) return json({ error: "empty", message: "الموقع لا يحتوي نصًا." }, 422);

    const dr = await admin.from("knowledge_docs").select("*").eq("id", doc_id).maybeSingle();
    const dd: any = dr?.data || {};
    let agentId = agent_id || dd.agentId || null;
    const wsId = workspace_id || dr?.workspace_id || null;

    let targets: string[] = [];
    if (agentId) targets = [agentId];
    else {
      const ar = await admin.from("agents").select("id").eq("workspace_id", wsId);
      targets = (ar.data || []).map((a: any) => a.id);
    }
    if (!targets.length) return json({ error: "no_agent" }, 422);

    const chunks = chunkText(pages.join("\n")).slice(0, 600);
    const genAI = new GoogleGenerativeAI(Deno.env.get("GEMINI_API_KEY")!);
    const embModel = genAI.getGenerativeModel({ model: "text-embedding-004" });
    await admin.from("knowledge_chunks").delete().eq("doc_id", doc_id);

    const rows: any[] = [];
    for (let i = 0; i < chunks.length; i += 20) {
      const batch = chunks.slice(i, i + 20);
      const r = await embModel.batchEmbedContents(batch.map(c => ({ content: c })));
      r.embeddings.forEach((e: any, j: number) => {
        targets.forEach(tg => rows.push({
          workspace_id: wsId, doc_id, content: batch[j],
          embedding: e.values, agent_id: tg
        }));
      });
    }
    const ins = await admin.from("knowledge_chunks").insert(rows);
    if (ins.error) return json({ error: "insert", message: ins.error.message }, 500);

    if (dr) {
      dd.status = "ready"; dd.chunkCount = chunks.length;
      dd.lastSync = Date.now(); dd.pages = visited.size; dd.error = "";
      await admin.from("knowledge_docs").update({ data: dd }).eq("id", doc_id);
    }
    return json({ ok: true, chunks: chunks.length, pages: visited.size });
  } catch (err) {
    console.error(err);
    return json({ error: "server", message: "فشل الزحف." }, 500);
  }
});
</script>

function classifyConvo(c){const t=norm((c.messages||[]).filter(m=>m.from==='visitor').map(m=>String(m.text||'')).join(' '));let score=0;const tags=[];if(/(سعر|بكم|يكلف)/.test(t)){score+=10;tags.push('سأل عن السعر')}if(/(توصيل|شحن)/.test(t)){score+=15;tags.push('سأل عن التوصيل')}if(/(دفع|فيزا|كاش)/.test(t)){score+=20;tags.push('سأل عن الدفع')}if(/(اريد اطلب|ابغي اطلب|اشتري)/.test(t)){score+=40;tags.push('نية شراء')}if(/(موظف|انسان|بشري)/.test(t))tags.push('طلب موظف');score=Math.min(score,100);let cls='استفسار عام';if(c.status==='handoff')cls='يحتاج متابعة';else if(score>=60)cls='مشتري';else if(score>=40)cls='عميل محتمل';else if(score>=15)cls='مهتم';return {score,cls,tags}}
function updateCustomerInsights(convo){const s=ws();if(!s||!convo)return;const cust=s.contacts.find(x=>x.id===convo.contactId);if(!cust)return;const r=classifyConvo(convo);cust.leadScore=r.score;cust.class=r.cls;cust.lastSeen=now();const manual=(cust.tags||[]).filter(tg=>!AUTO_TAGS.has(tg));cust.tags=[...new Set(manual.concat(r.tags))].slice(0,12)}

const DEMO_TEXTS=['سماعة بلوتوث برو بسعر 199 ريال.','التوصيل خلال 24 ساعة.'];
function demoDocs(){return DEMO_TEXTS.map(t=>({agentId:'',chunks:t.split('\n').map(s=>({text:s,toks:tokens(s)}))}))}
function searchKB(q,agentId){const qt=tokens(q);if(!qt.length)return[];const hits=[];const s=ws();const src=(s&&Array.isArray(s.kb)&&s.kb.length)?s.kb.filter(k=>k.status==='ready'&&(!k.agentId||k.agentId===agentId)):demoDocs();src.forEach(d=>(d.chunks||[]).forEach(ch=>{let sc=0;qt.forEach(t=>ch.toks.forEach(ct=>{if(ct.indexOf(t)>-1||t.indexOf(ct)>-1)sc++}));if(sc>0)hits.push({sc,text:ch.text})}));return hits.sort((a,b)=>b.sc-a.sc).slice(0,2)}
const HANDOFF=['موظف','انسان','بشري','شخص حقيقي','مختص','مسؤول'];
function aiRespondLocal(text,agent,agentId){const t=norm(text);if(HANDOFF.some(k=>t.indexOf(norm(k))>-1))return {text:'حولتك للموظف المختص ✋',handoff:true};if(/^(سلام|هلا|مرحبا|اهلا|هاي)/.test(t)&&t.length<15)return {text:'أهلًا وسهلًا 👋'};if(t.indexOf('شكرا')>-1)return {text:'العفو 🤍'};const hits=searchKB(text,agentId);if(hits.length&&hits[0].sc>=1)return {text:hits.map(h=>h.text).join('\n')};return {text:(agent&&agent.fallback)||'عذرًا، ما عندي معلومات.'}}
async function getAIReply(text,agent,widget,convo){if(isRemote()&&cfg&&apiBase()&&widget){try{const res=await fetch(apiBase()+'/ai-respond',{method:'POST',headers:{'Content-Type':'application/json','api-key':cfg.key},body:JSON.stringify({widget_id:widget.id,token:widget.token,message:text,conversation_id:convo?convo.id:null})});const j=await res.json().catch(()=>({}));if(j&&j.handoff_locked)return {text:j.message||'المحادثة بيد فريق الدعم.',system:true};if(j&&j.error==='limit')return {text:j.message||'تم تجاوز الحد.',system:true};if(j&&j.error)return {text:j.message||'عذرًا، حصل خطأ.',system:false};if(j&&j.reply){if(j.handoff&&convo)convo.status='handoff';return {text:j.reply,handoff:!!j.handoff}}throw new Error('bad')}catch(e){console.error('ai-respond:',e)}}return new Promise(resolve=>setTimeout(()=>resolve(aiRespondLocal(text,agent,widget?widget.agentId:undefined)),700))}

async function fetchPage(url){try{const ctl=(typeof AbortController!=='undefined')?new AbortController():null;const to=ctl?setTimeout(()=>ctl.abort(),12000):null;const r=await fetch(url,{mode:'cors',signal:ctl?ctl.signal:undefined});if(to)clearTimeout(to);if(r.ok){const ct=(r.headers.get('content-type')||'');if(ct.indexOf('html')>-1||ct.indexOf('text')>-1||ct==='')return await r.text()}throw new Error('direct')}catch(e){const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(url);const r2=await fetch(proxy);if(!r2.ok)throw new Error('تعذر الوصول');const j=await r2.json().catch(()=>null);if(j&&j.contents)return j.contents;throw new Error('تعذر جلب المحتوى')}}
function extractHtml(html,baseUrl){const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,style,noscript,svg,iframe,nav,footer,form,button,header').forEach(n=>n.remove());const titleEl=d.querySelector('title');const title=titleEl?(titleEl.textContent||'').trim():'';const body=d.querySelector('main')||d.querySelector('body')||d.documentElement;const text=((title?title+'\n':'')+(body?body.textContent:'')).replace(/\s+/g,' ').trim();let origin='';try{origin=new URL(baseUrl).origin}catch(e){}const links=Array.from(d.querySelectorAll('a[href]')).map(a=>{try{return new URL(a.getAttribute('href'),baseUrl).toString()}catch(e){return null}}).filter(x=>x&&origin&&x.indexOf(origin)===0);return {text,links}}
async function crawlLocal(url,doc){const origin=new URL(url).origin;const visited=new Set();const queue=[url];const pages=[];while(queue.length&&visited.size<10){const next=queue.shift();let u;try{u=new URL(next)}catch(e){continue}const key=u.origin+u.pathname;if(u.origin!==origin||visited.has(key))continue;visited.add(key);try{const html=await fetchPage(u.toString());const res=extractHtml(html,u.toString());if(res.text.length>40)pages.push('صفحة: '+u.pathname+'\n'+res.text.slice(0,20000));res.links.forEach(l=>queue.push(l))}catch(e){}}if(!pages.length)throw new Error('الموقع لا يحتوي نصًا كافيًا');doc.content=pages.join('\n').slice(0,60000);chunkify(doc);doc.pages=visited.size;doc.status='ready';doc.lastSync=now()}
async function processUrl(url,doc){doc.status='processing';doc.error='';doc.content='جارٍ الزحف...';save();refreshKbUI();try{if(isRemote()&&cfg&&apiBase()&&db.ws&&db.ws.__wid){const resp=await fetch(apiBase()+'/kb-crawl',{method:'POST',headers:{'Content-Type':'application/json','api-key':cfg.key},body:JSON.stringify({url:url,doc_id:doc.id,workspace_id:db.ws.__wid,agent_id:doc.agentId||null})});const j=await resp.json().catch(()=>null);if(!resp.ok||!j||j.error)throw new Error(arErr((j&&j.message)||('فشل ('+resp.status+')')));doc.status='ready';doc.chunkCount=j.chunks||0;doc.pages=j.pages||1;doc.lastSync=now();doc.content='تم الزحف — '+(j.pages||1)+' صفحة، '+(j.chunks||0)+' مقطعًا.';save();refreshKbUI();toast('تم زحف الموقع ✔','ok');return}await crawlLocal(url,doc);save();refreshKbUI();toast('تم استخراج معلومات الموقع ✔','ok')}catch(err){console.error('KB crawl:',err);doc.status='error';doc.error=arErr(err.message||String(err));doc.content='فشل: '+doc.error;save();refreshKbUI();toast('فشل الزحف: '+doc.error,'err')}}
async function extractFileClient(file){const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='txt'||ext==='csv'||ext==='md')return await file.text();if(ext==='pdf'){if(!window.pdfjsLib)throw new Error('مكتبة PDF غير محملة');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const buf=await file.arrayBuffer();const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,200);i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();out+=tc.items.map(it=>it.str).join(' ')+'\n'}return out}if(ext==='docx'){if(!window.mammoth)throw new Error('مكتبة DOCX غير محملة');const buf=await file.arrayBuffer();const r=await window.mammoth.extractRawText({arrayBuffer:buf});return r.value}if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw new Error('مكتبة Excel غير محملة');const buf=await file.arrayBuffer();const wb=window.XLSX.read(buf,{type:'array'});let out='';wb.SheetNames.forEach(sn=>{out+='\n['+sn+']\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[sn])});return out}throw new Error('نوع الملف غير مدعوم: '+ext)}

function kbTypeModalOpen(type){if(type==='file'){modal('<h3 class="font-display font-bold mb-3">رفع ملف</h3><form id="f-kbm-file" class="space-y-3"><div id="kb-drop" class="rounded-xl border-2 border-dashed border-ink-600 hover:border-tiffany-500/60 transition p-6 text-center cursor-pointer"><div class="text-ink-400 text-sm">اسحب أو اضغط</div><div class="text-[10px] text-ink-600 mt-1">PDF, DOCX, XLS, XLSX, CSV, TXT</div><input id="kb-filepick" type="file" accept=".pdf,.txt,.docx,.csv,.xlsx,.xls,.md" class="hidden"></div><div id="kb-fileinfo" class="hidden glass rounded-xl p-3 flex items-center justify-between text-xs"><span id="kb-filename" class="font-semibold"></span><span id="kb-filesize" class="text-ink-500"></span></div><label class="lbl2">Agent<select id="kbm-file-agent" class="inp-s">'+agentOptions('')+'</select></label><div class="flex gap-2"><button class="btn-primary flex-1">رفع</button><button type="button" data-action="modal-close" class="btn-ghost">إلغاء</button></div></form>');setTimeout(()=>{var drop=document.getElementById('kb-drop'),inp=document.getElementById('kb-filepick');if(!drop||!inp)return;drop.addEventListener('click',()=>inp.click());['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('border-tiffany-500')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('border-tiffany-500');if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files[0]){inp.files=e.dataTransfer.files;showFileInfo(inp.files[0])}}));inp.addEventListener('change',()=>{if(inp.files[0])showFileInfo(inp.files[0])})},50)}else if(type==='text'){modal('<h3 class="font-display font-bold mb-3">نص يدوي</h3><form id="f-kbm-text" class="space-y-3"><label class="lbl2">العنوان<input name="title" class="inp-s" placeholder="مثال: أوقات العمل"></label><label class="lbl2">النص *<textarea name="content" rows="6" required class="inp-s" placeholder="مثال: الدوام من السبت إلى الخميس"></textarea> function pgKB(){var w=ws();var docs=w.kb.map(k=>{var cnt=(k.chunkCount!=null)?k.chunkCount:((k.chunks&&k.chunks.length)||0);var ag=k.agentId?w.agents.find(a=>a.id===k.agentId):null;var icn=k.type==='url'?'globe':k.type==='file'?'doc':'edit';var typeLbl=k.type==='url'?'رابط':k.type==='file'?'ملف':'نص';var acts='';if(k.type==='url')acts+='<button data-action="kb-reprocess" data-id="'+k.id+'" class="p-2 text-tiffany-300 hover:bg-tiffany-500/10 rounded-lg">'+icon('refresh','w-4 h-4')+'</button>';if(k.type==='file')acts+='<button data-action="kb-reprocess" data-id="'+k.id+'" class="p-2 text-tiffany-300 hover:bg-tiffany-500/10 rounded-lg">'+icon('refresh','w-4 h-4')+'</button>';if(k.type==='text')acts+='<button data-action="kb-edit" data-id="'+k.id+'" class="p-2 text-ink-400 hover:text-white hover:bg-ink-800 rounded-lg">'+icon('edit','w-4 h-4')+'</button>';acts+='<button data-action="kb-del" data-id="'+k.id+'" class="p-2 text-red-400 hover:bg-red-500/10 rounded-lg">'+icon('trash','w-4 h-4')+'</button>';return '<div class="glass rounded-2xl p-5"><div class="flex items-start gap-4"><span class="w-11 h-11 rounded-xl bg-tiffany-500/10 text-tiffany-400 flex items-center justify-center flex-none">'+icon(icn,'w-5 h-5')+'</span><div class="flex-1 min-w-0"><div class="flex items-center gap-2 flex-wrap"><b class="text-sm">'+esc(k.name)+'</b>'+kbStatusBadge(k)+'</div><div class="text-[11px] text-ink-500 mt-1 flex flex-wrap gap-x-3"><span>'+typeLbl+'</span><span>Agent: '+(ag?esc(ag.name):'مشترك')+'</span><span>'+cnt+' مقطع</span><span>أُضيف: '+fmtDate(k.createdAt)+'</span>'+(k.lastSync?'<span>آخر: '+timeAgo(k.lastSync)+'</span>':'')+'</div><p class="text-xs text-ink-400 mt-2 leading-6 line-clamp-2">'+esc(k.content||'')+'</p>'+(k.status==='error'?'<div class="text-[11px] text-red-300 mt-1">السبب: '+esc(k.error||'')+'</div>':'')+'</div><div class="flex gap-1 flex-none">'+acts+'</div></div></div>'}).join('');return '<div class="flex items-center justify-between mb-5 flex-wrap gap-3"><div><h2 class="font-display font-bold text-xl">مصادر المعرفة</h2><p class="text-xs text-ink-500 mt-1">كل مصدر معزول حسب الـ Agent.</p></div><button data-action="kb-add" class="btn-primary">'+icon('plus','w-4 h-4')+' إضافة</button></div>'+kbDiagnostics()+'<div class="space-y-3">'+(docs||'<div class="glass rounded-2xl p-12 text-center text-ink-500">لا مصادر.</div>')+'</div>'}
function pgAnalytics(){var w=ws();var total=w.convos.length||1;var closed=w.convos.filter(c=>c.status==='closed').length;var hand=w.convos.filter(c=>c.status==='handoff').length;var act=Math.max(total-closed-hand,0);var days=[];for(var i=0;i<14;i++){var d0=new Date();d0.setHours(0,0,0,0);var from=d0.getTime()-(13-i)*DAY;days.push({d:from,v:w.convos.reduce((s,c)=>s+c.messages.filter(m=>m.at>=from&&m.at<from+DAY).length,0)})}var max=Math.max.apply(null,days.map(x=>x.v).concat([1]));return '<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 glass rounded-2xl p-6"><h3 class="font-display font-bold mb-5">الرسائل يوميًا</h3><div class="flex items-end gap-1.5 h-44">'+days.map(x=>'<div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-t-md bar bg-tiffany-500/70" style="height:'+Math.max(x.v/max*100,3)+'%"></div><span class="text-[9px] text-ink-600">'+fmtDate(x.d)+'</span></div>').join('')+'</div></div><div class="glass rounded-2xl p-6"><h3 class="font-display font-bold mb-4">الحالات</h3><div class="space-y-2 text-xs"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-tiffany-500"></span>نشطة: <b>'+act+'</b></div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span>تحويل: <b>'+hand+'</b></div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-ink-700"></span>مغلقة: <b>'+closed+'</b></div></div></div></div>'}
